version: "3.9"

services:
  backend:
    build: ./backend
    container_name: firetunnel-backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: firetunnel-dashboard
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
