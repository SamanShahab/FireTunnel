# FireTunnel — WireGuard VPN Configuration
# Apply this on OPNsense under VPN > WireGuard

# ============ SERVER (OPNsense) ============
[Interface]
# Generate with: wg genkey | tee server_private.key | wg pubkey > server_public.key
PrivateKey = <server_private_key>
Address = 10.10.10.1/24
ListenPort = 51820

# ============ CLIENT 1 — VPN User A ============
[Peer]
# Allowed: Internal Web Server only
PublicKey = <client1_public_key>
AllowedIPs = 10.10.10.2/32

# ============ CLIENT 2 — VPN User B ============
[Peer]
# Allowed: Internal Web + DB
PublicKey = <client2_public_key>
AllowedIPs = 10.10.10.3/32

# ============================================
# CLIENT CONFIG (save as client1.conf)
# ============================================
# [Interface]
# PrivateKey = <client1_private_key>
# Address = 10.10.10.2/24
# DNS = 192.168.10.1
#
# [Peer]
# PublicKey = <server_public_key>
# Endpoint = <opnsense_wan_ip>:51820
# AllowedIPs = 192.168.10.0/24
# PersistentKeepalive = 25

# ============================================
# OPNsense Firewall Rules for VPN
# ============================================
# Allow VPN → Internal Web (port 80)
# Source: 10.10.10.0/24
# Destination: 192.168.10.10
# Port: 80
# Action: ALLOW
#
# Block VPN → Internal DB (port 3306) for User A
# Source: 10.10.10.2
# Destination: 192.168.10.10
# Port: 3306
# Action: BLOCK
